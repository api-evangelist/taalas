gaps:
- No 401 response object is declared on any operation in either published spec, despite 401 being
  the universal unauthenticated behaviour.
- No 429 / rate-limit or 5xx / capacity error is declared, even though /health exposes a queue
  depth that implies request queuing and possible saturation.
- Successful 200 responses on /generate, /models, /v1/models, /v1/completions and
  /v1/chat/completions are declared with an empty schema ({}), so neither the success nor the
  error envelope of the inference operations is fully machine-readable.
