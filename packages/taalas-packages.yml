interoperability:
  openai_compatible_clients: true
  note: >-
    Because /v1 implements the OpenAI Completions and Chat Completions request shapes, official
    OpenAI SDKs (openai-python, openai-node and compatible clients) can target Taalas by setting
    base_url to https://api.taalas.com/v1 and passing the Taalas API key as the bearer token. This
    is inferred from the published contract, not from a Taalas instruction.
