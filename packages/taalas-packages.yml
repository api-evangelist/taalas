note: >-
  Taalas publishes no first-party client libraries. There is no Taalas GitHub organization
  (github.com/taalas is an unrelated personal account; api.github.com/orgs/taalas returns 404) and
  no package under the taalas name exists on PyPI, crates.io, RubyGems, NuGet or Packagist. The
  packages below are third-party, community-built wrappers found in public registries and are
  recorded for discovery only — every one is marked official: false, and no SDKs pointer is emitted
  for this provider. In practice the OpenAI-compatible /v1 surface means any OpenAI client library
  works by changing the base URL, which is the closest thing Taalas has to an SDK story.
