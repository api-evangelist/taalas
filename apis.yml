aid: taalas
name: Taalas
description: >-
  Taalas is a Toronto-based semiconductor company building "Hardcore Models" — AI models etched
  directly into custom silicon rather than executed as software on general-purpose GPUs, under the
  tagline "The Model is The Computer." Its first product, the HC1 technology demonstrator, hard-wires
  Meta's Llama 3.1 8B into an 815mm2 / 53-billion-transistor die on TSMC's 6nm process and is publicly
  demonstrated through the ChatJimmy chatbot. Taalas exposes that silicon to developers through a
  hosted inference REST API at api.taalas.com, which publishes two OpenAPI 3.1.0 contracts: a root
  API with health, model-info and a Taalas-native /generate operation, and an OpenAI-compatible /v1
  surface with /v1/completions and /v1/chat/completions. Access is by bearer API key issued through
  an application form; applications are currently closed due to demand.
