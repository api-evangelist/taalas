apis:
- name: Taalas API
  description: >-
    Taalas-native REST interface for running inference against the HC1 hardcore-model silicon. Three
    operations: a public /health probe reporting server status, queue depth and the currently loaded
    LoRA adapter; /models for model information; and /generate, the Taalas-native text-generation
    operation supporting streaming, tool calling, guided JSON/regex generation, logprobs and stop
    sequences. Authenticated with a bearer API key; only /health is reachable anonymously.
  humanURL: https://api.taalas.com/docs
  baseURL: https://api.taalas.com
  tags:
  - ai-inference
  - large-language-models
  - llama
  - inference-api
