  - type: Overlay
    url: overlays/taalas-inference-api-overlay.yaml
- name: Taalas API v1 (OpenAI-compatible)
  description: >-
    OpenAI-compatible inference surface served under /v1 on api.taalas.com, so existing OpenAI client
    libraries can be pointed at Taalas hardcore-model silicon by changing the base URL. Exposes
    /v1/models, /v1/completions and /v1/chat/completions with the familiar model, messages,
    temperature, top_p, stop, max_tokens, logit_bias, tools and stream_options parameters, plus
    multimodal text/image message content and function-calling tool definitions.
  humanURL: https://api.taalas.com/v1/docs
  baseURL: https://api.taalas.com/v1
